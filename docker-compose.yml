services:
  mongo:
    image: mongo:7
    container_name: smart-leads-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: smart-leads-server
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/smart-leads
      JWT_SECRET: change-this-secret-before-production
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      PORT: 5000
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: smart-leads-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo-data:
